[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appstore-reviews-analysis"
version = "0.1.0"
description = "One-off public Apple App Store RSS review collector"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "fasttext-wheel>=0.9.2,<1",
    "numpy>=1.24,<2",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
sentiment = ["torch>=2.6,<3", "transformers>=4.57,<5", "sentencepiece>=0.2,<1"]
keywords = ["sentence-transformers>=5.1,<6", "stopwordsiso>=0.6,<1", "scikit-learn>=1.5,<2"]

[tool.setuptools.packages.find]
include = ["appstore_reviews*"]
